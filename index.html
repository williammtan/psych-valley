<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Psyche</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d0b14;
        overflow: hidden;
        font-family: ui-monospace, monospace;
      }
      #game { width: 100vw; height: 100vh; display: block; }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      #boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        color: #d8c69c; letter-spacing: 0.3em; font-size: 12px;
        background: #0d0b14; transition: opacity 0.4s ease; pointer-events: none;
      }
      #boot.hidden { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">LUMEN VALE</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
